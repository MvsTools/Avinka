<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Telefoontest</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font: 15px/1.5 system-ui, sans-serif;
        background: #17251d;
        color: #f6f3ea;
      }
      h1 { font-size: 18px; margin: 0 0 14px; }
      p { margin: 0 0 8px; }
      .regel { padding: 8px 10px; border-radius: 8px; background: #ffffff14; }
      .goed { background: #1f7a4d; }
      .fout { background: #8c2b2b; }
      code { font-size: 12px; word-break: break-all; }
      button {
        margin-top: 14px;
        padding: 14px 18px;
        font-size: 16px;
        font-weight: 700;
        border: 0;
        border-radius: 10px;
        background: #f6f3ea;
        color: #17251d;
      }
    </style>
  </head>
  <body>
    <!--
      TIJDELIJKE TESTPAGINA — hoort bij het uitzoeken waarom er op de telefoon
      van de eigenaar geen enkele knop werkt op /nieuw6. Bewust een kaal HTML-
      bestand: geen Next, geen React, geen bundel. Zo scheiden we "javascript
      doet het niet op dit toestel" van "de app van Next start niet".
      Weggooien zodra dat duidelijk is.
    -->
    <h1>Telefoontest</h1>

    <p class="regel fout" id="stap1">1. gewoon script — NIET gedraaid</p>
    <p class="regel fout" id="stap2">2. moderne schrijfwijze — NIET gedraaid</p>
    <p class="regel fout" id="stap3">3. los scriptbestand — NIET geladen</p>
    <p class="regel fout" id="stap4">4. knop indrukken — nog niet gedaan</p>
    <p class="regel" id="fouten">fouten: nog geen</p>
    <p class="regel"><code id="browser">browser: onbekend</code></p>

    <button id="knop" type="button">Druk hier</button>

    <script>
      // Vangt fouten van alles wat hierna komt.
      window.onerror = function (bericht) {
        var f = document.getElementById('fouten');
        f.textContent = 'fout: ' + bericht;
        f.className = 'regel fout';
      };

      // 1 · Doet de browser überhaupt javascript?  (ouderwetse schrijfwijze,
      //     werkt in werkelijk elke browser)
      var e1 = document.getElementById('stap1');
      e1.textContent = '1. gewoon script — WERKT';
      e1.className = 'regel goed';

      // De browser zelf, zodat ik weet waar ik mee te maken heb.
      document.getElementById('browser').textContent = 'browser: ' + navigator.userAgent;

      // 4 · Reageert een knop op een vingertik?
      document.getElementById('knop').addEventListener('click', function () {
        var e4 = document.getElementById('stap4');
        e4.textContent = '4. knop indrukken — WERKT';
        e4.className = 'regel goed';
      });
    </script>

    <script>
      // 2 · Moderne schrijfwijze. Begrijpt de browser dit niet, dan slaat hij
      //     dit hele blok over — en dan struikelt hij ook over de code van de
      //     echte pagina, want die is in dezelfde stijl geschreven.
      const test = { a: { b: 1 } };
      const uit = test?.a?.b ?? 0;
      const opgeteld = [1, 2, 3].map((n) => n * uit).at(-1);
      if (opgeteld === 3) {
        const e2 = document.getElementById('stap2');
        e2.textContent = '2. moderne schrijfwijze — WERKT';
        e2.className = 'regel goed';
      }
    </script>

    <!-- 3 · Haalt de telefoon een los scriptbestand op van deze server? -->
    <script src="/telefoontest.js"></script>
  </body>
</html>
